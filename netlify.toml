[build]
  base = "cloud/netlify"
  command = "npm test && node probe.mjs"
  publish = "public"
  functions = "functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[functions.hotspot-schedule]
  schedule = "0 0,4,10 * * *"

[context.deploy-preview]
  command = "npm test"
